name: TestFlight

# Thin wrapper: all build logic is in ci/build.sh (so it can change without
# editing this file). Runs on every push to main that touches the app, or by hand.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID (API key needs Admin role).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ci/**", "ios/**", "www/**", "capacitor.config.*", "package.json", "package-lock.json"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash ci/build.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
